# 운영 서버(Nginx) 설정 템플릿 - 서버가 정해지면 도메인/경로/인증서 경로를 채워서 사용하세요.
# 배치 위치 예: /etc/nginx/sites-available/ai-trading.conf

server {
    listen 80;
    server_name REPLACE_WITH_DOMAIN;

    root /var/www/ai-trading/api/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-api:9000; # docker-compose 서비스명 또는 unix socket 경로로 교체
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 유저별 트레이딩뷰 웹훅 수신 (Step 3-b). PHP 가 아니라 Python 엔진이 받는다 —
    # 신호 파이프라인과 같은 프로세스에서 처리하기 위함이다(prompt.md v2 [Step 3] 요구사항 2).
    # 엔진은 127.0.0.1 에만 바인딩하므로 외부에서는 이 경로로만 도달할 수 있다.
    location /webhook/tv/ {
        proxy_pass http://127.0.0.1:8100;  # WEBHOOK_PORT 와 같아야 한다
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 트레이딩뷰 알림 본문은 작다. 큰 요청은 엔진에 닿기 전에 자른다.
        client_max_body_size 16k;
        proxy_read_timeout 10s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # TODO: 서버 확정 후 Let's Encrypt(certbot) 등으로 HTTPS(443) 설정 추가
}
