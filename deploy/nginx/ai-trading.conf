# 운영 서버(Nginx) 설정 템플릿 - 서버가 정해지면 도메인/경로/인증서 경로를 채워서 사용하세요.
# 배치 위치 예: /etc/nginx/sites-available/ai-trading.conf

server {
    listen 80;
    server_name REPLACE_WITH_DOMAIN;

    root /var/www/ai-trading/api/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-api:9000; # docker-compose 서비스명 또는 unix socket 경로로 교체
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # TODO: 서버 확정 후 Let's Encrypt(certbot) 등으로 HTTPS(443) 설정 추가
}
