name: CI

on:
  pull_request:
    branches: [main]
  # Deploy 워크플로에서 재사용(main 푸시 시 Deploy가 이 워크플로를 먼저 호출)
  workflow_call:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r trading_engine/requirements.txt
      - run: pytest

  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: composer install --working-dir=api --no-interaction
      - run: composer test --working-dir=api
