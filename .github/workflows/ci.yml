name: CI

on:
  pull_request:
    branches: [main]
  # Deploy 워크플로에서 재사용(main 푸시 시 Deploy가 이 워크플로를 먼저 호출)
  workflow_call:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r trading_engine/requirements.txt
      - name: pytest
        run: |
          # 테스트 파일이 아직 없으면 pytest는 종료코드 5(no tests collected)를 반환한다.
          # 실제 테스트가 추가되기 전까지는 이를 실패로 취급하지 않는다.
          code=0
          pytest trading_engine/tests || code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::수집된 테스트가 없습니다 (exit 5) - 성공으로 처리합니다. Step 1 구현 시 테스트를 추가하세요."
            exit 0
          fi
          exit "$code"

  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: composer install --working-dir=api --no-interaction
      # TODO: PHPUnit 테스트 추가 후 아래 주석 해제
      # - run: composer test --working-dir=api
